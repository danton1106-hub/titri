name: Обновление сайта

on:
  schedule:
    - cron: '0 7 * * *'     # 10:00 МСК
    - cron: '0 16 * * *'    # 19:00 МСК
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Данные главной (TMDB)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 scripts/fetch_home.py

      - name: Каталог 2026 и «Скоро» (TMDB)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 scripts/fetch_catalog.py

      - name: Сборка главной
        run: python3 scripts/build_home.py

      - name: Сборка страниц сайта
        run: python3 scripts/build_site.py

      - name: Рейтинги IMDb и Томатов
        continue-on-error: true
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: python3 scripts/fetch_ratings.py

      - name: Черновики статей (RSS)
        continue-on-error: true
        run: python3 scripts/collect_articles.py

      - name: Коммит изменений
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Изменений нет."
          else
            git commit -m "Автообновление: $(TZ=Europe/Moscow date +'%d.%m.%Y %H:%M') МСК"
            git push
          fi
